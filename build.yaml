# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  # DASBOB 36 keys
#  - board: nice_nano_v2
#    shield: dasbob_left
#    keymap: shared
#  - board: nice_nano_v2
#    shield: dasbob_right
#    keymap: shared

  # sweep bling LP
  - board: nice_nano_v2
    shield: cradio_left
    keymap: shared
    extra-modules:
      - modules/magic-key
  - board: nice_nano_v2
    shield: cradio_right
    keymap: shared
    extra-modules:
      - modules/magic-key

  - board: nice_nano
    shield: settings_reset